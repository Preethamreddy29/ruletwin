name: ruletwin

services:
  postgres:
    image: postgres:16.6-alpine
    profiles: ["core", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend, hostbridge]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["core", "full"]
    environment:
      RULETWIN_ENVIRONMENT: dev
      RULETWIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RULETWIN_LOG_LEVEL: INFO
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["core", "full"]
    environment:
      RULETWIN_ENVIRONMENT: dev
      RULETWIN_DATABASE_URL: postgresql+psycopg://ruletwin_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RULETWIN_LOG_LEVEL: ${RULETWIN_LOG_LEVEL:-INFO}
      RULETWIN_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports: ["8000:8000"]
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["core", "full"]
    environment:
      RULETWIN_ENVIRONMENT: dev
      RULETWIN_DATABASE_URL: postgresql+psycopg://ruletwin_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RULETWIN_LOG_LEVEL: ${RULETWIN_LOG_LEVEL:-INFO}
    command: ["ruletwin-worker"]
    depends_on:
      seed:
        condition: service_completed_successfully
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["core", "full"]
    environment:
      RULETWIN_ENVIRONMENT: dev
      RULETWIN_DATABASE_URL: postgresql+psycopg://ruletwin_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RULETWIN_LOG_LEVEL: INFO
    command: ["ruletwin-seed", "--seed", "ruletwin-dev-v1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: ["core", "full"]
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability", "full"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  backend:
    internal: true
  hostbridge:
  frontend:

volumes:
  postgres-data:
  prometheus-data:
